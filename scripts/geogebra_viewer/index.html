<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoGebra: ход решения</title>
<style>
  :root {
    --bg: #f5f5f4;
    --panel: #ffffff;
    --ink: #1c1917;
    --muted: #78716c;
    --line: #e7e5e4;
    --accent: #b91c1c;
    --accent-soft: #fef2f2;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  #app { display: flex; height: 100%; }

  aside {
    width: 380px;
    flex: 0 0 380px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  aside > header {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--line);
  }
  #title { margin: 0; font-size: 17px; font-weight: 650; }
  #source { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

  #steps { list-style: none; margin: 0; padding: 8px; overflow-y: auto; flex: 1 1 auto; }
  #steps li {
    padding: 9px 11px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    margin-bottom: 2px;
  }
  #steps li:hover { background: #fafaf9; }
  #steps li.current { background: var(--accent-soft); border-color: #fecaca; }
  #steps li.future { opacity: .45; }
  .step-head { display: flex; gap: 8px; align-items: baseline; }
  .step-num {
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: var(--muted);
    min-width: 1.4em;
  }
  .step-title { font-weight: 550; }
  .step-text { margin: 3px 0 0 calc(1.4em + 8px); font-size: 13px; color: #57534e; white-space: pre-wrap; }

  #errors {
    border-top: 1px solid var(--line);
    padding: 10px 14px;
    font-size: 12.5px;
    color: var(--accent);
    background: var(--accent-soft);
    max-height: 30%;
    overflow-y: auto;
  }
  #errors:empty { display: none; }
  #errors code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
  #ggb { flex: 1 1 auto; min-height: 0; background: #fff; }
  #ggb > * { display: block; }

  #controls {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: var(--panel);
    border-top: 1px solid var(--line);
  }
  button {
    font: inherit;
    font-size: 14px;
    padding: 5px 11px;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 7px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #fafaf9; }
  button:disabled { opacity: .4; cursor: default; }
  #counter { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; min-width: 4.5em; text-align: center; }
  #slider { flex: 1 1 auto; }
  #status { font-size: 12.5px; color: var(--muted); min-width: 8em; text-align: right; }
  #status.stale { color: var(--accent); }
</style>
</head>
<body>
<div id="app">
  <aside>
    <header>
      <h1 id="title">Сцена не загружена</h1>
      <p id="source"></p>
    </header>
    <ol id="steps"></ol>
    <div id="errors"></div>
  </aside>
  <main>
    <div id="ggb"></div>
    <div id="controls">
      <button data-act="first" title="В начало (Home)">⏮</button>
      <button data-act="prev" title="Назад (←)">←</button>
      <span id="counter">—</span>
      <button data-act="next" title="Вперёд (→)">→</button>
      <button data-act="last" title="В конец (End)">⏭</button>
      <button data-act="play" title="Проиграть (пробел)">▶</button>
      <input type="range" id="slider" min="0" max="0" value="0" disabled>
      <span id="status"></span>
    </div>
  </main>
</div>

<script src="https://www.geogebra.org/apps/deployggb.js"></script>
<script src="viewer.js"></script>
<script>
(function () {
  "use strict";

  var el = {
    title: document.getElementById("title"),
    source: document.getElementById("source"),
    steps: document.getElementById("steps"),
    errors: document.getElementById("errors"),
    ggb: document.getElementById("ggb"),
    counter: document.getElementById("counter"),
    slider: document.getElementById("slider"),
    status: document.getElementById("status")
  };

  var version = -1;
  var pageNotes = [];
  var last = null;

  var engine = window.GeoGebraSteps.create({ mount: el.ggb, onState: render });

  // "#step=4" opens the page on step 4; the hash follows every step change so
  // a link can point at one moment of the solution.
  var m = /^#step=(\d+)$/.exec(location.hash || "");
  if (m) { engine.startAt(parseInt(m[1], 10)); }

  window.addEventListener("error", function (ev) {
    pageNotes.push("ошибка страницы: " + (ev.message || ev.error));
    if (last) { render(last); }
  });

  function setStatus(text, bad) {
    el.status.textContent = text || "";
    el.status.classList.toggle("stale", !!bad);
  }

  /* ---------- rendering ---------- */

  function render(state) {
    last = state;
    var scene = state.scene;
    if (!scene) { return; }

    document.title = scene.title ? scene.title + " — GeoGebra" : "GeoGebra: ход решения";
    el.title.textContent = scene.title || "Без названия";
    el.source.textContent = scene.source || "";

    renderSteps(scene, state.step);
    renderControls(state);
    renderErrors(state);

    var want = "#step=" + (state.step + 1);
    if (location.hash !== want) { history.replaceState(null, "", want); }
    if (state.ready) { setStatus("объектов: " + engine.objectCount(), false); }
  }

  function renderSteps(scene, step) {
    el.steps.innerHTML = "";
    scene.steps.forEach(function (s, i) {
      var li = document.createElement("li");
      li.className = i === step ? "current" : (i > step ? "future" : "");
      var head = document.createElement("div");
      head.className = "step-head";
      var num = document.createElement("span");
      num.className = "step-num";
      num.textContent = (i + 1) + ".";
      var ttl = document.createElement("span");
      ttl.className = "step-title";
      ttl.textContent = s.title || "Шаг " + (i + 1);
      head.appendChild(num);
      head.appendChild(ttl);
      li.appendChild(head);
      if (s.text) {
        var p = document.createElement("div");
        p.className = "step-text";
        p.textContent = s.text;
        li.appendChild(p);
      }
      li.addEventListener("click", function () { engine.goto(i); });
      el.steps.appendChild(li);
    });
    var cur = el.steps.children[step];
    if (cur && cur.scrollIntoView) { cur.scrollIntoView({ block: "nearest" }); }
  }

  function renderControls(state) {
    var lastIndex = state.total - 1;
    el.counter.textContent = (state.step + 1) + " / " + state.total;
    el.slider.max = String(lastIndex);
    el.slider.value = String(state.step);
    el.slider.disabled = lastIndex === 0;
    document.querySelector('[data-act="first"]').disabled = state.step === 0;
    document.querySelector('[data-act="prev"]').disabled = state.step === 0;
    document.querySelector('[data-act="next"]').disabled = state.step === lastIndex;
    document.querySelector('[data-act="last"]').disabled = state.step === lastIndex;
    document.querySelector('[data-act="play"]').textContent = state.playing ? "⏸" : "▶";
  }

  function renderErrors(state) {
    el.errors.innerHTML = "";
    if (state.failures.length) {
      var head = document.createElement("div");
      head.textContent = "GeoGebra не построила " + state.failures.length + " объект(ов):";
      el.errors.appendChild(head);
      state.failures.slice(0, 12).forEach(function (f) {
        var row = document.createElement("div");
        var where = f.step < 0 ? "setup" : "шаг " + (f.step + 1);
        row.innerHTML = "· " + where + ": <code></code>";
        row.querySelector("code").textContent = f.command;
        el.errors.appendChild(row);
      });
    }
    state.notes.concat(pageNotes).slice(-5).forEach(function (n) {
      var row = document.createElement("div");
      row.textContent = "· " + n;
      el.errors.appendChild(row);
    });
  }

  /* ---------- controls ---------- */

  document.getElementById("controls").addEventListener("click", function (ev) {
    var act = ev.target.getAttribute && ev.target.getAttribute("data-act");
    if (!act) { return; }
    if (act === "play") { engine.togglePlay(); }
    else if (act === "first") { engine.first(); }
    else if (act === "prev") { engine.prev(); }
    else if (act === "next") { engine.next(); }
    else if (act === "last") { engine.last(); }
  });

  el.slider.addEventListener("input", function () {
    engine.goto(parseInt(el.slider.value, 10) || 0);
  });

  document.addEventListener("keydown", function (ev) {
    if (ev.target.tagName === "INPUT") { return; }
    if (ev.key === "ArrowRight") { engine.next(); }
    else if (ev.key === "ArrowLeft") { engine.prev(); }
    else if (ev.key === "Home") { engine.first(); }
    else if (ev.key === "End") { engine.last(); }
    else if (ev.key === " ") { ev.preventDefault(); engine.togglePlay(); }
  });

  window.addEventListener("resize", function () { engine.resize(); });

  /* ---------- scene transport ---------- */

  var embedded = window.__SCENE__ || null;

  function poll() {
    fetch("api/scene", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.error) { setStatus(data.error, true); return; }
        if (data.version === version) { return; }
        version = data.version;
        engine.setScene(data.scene);
      })
      .catch(function () { setStatus("сервер недоступен", true); });
  }

  if (embedded) {
    setStatus("статичный файл", false);
    engine.setScene(embedded);
  } else {
    poll();
    setInterval(poll, 1000);
  }
})();
</script>
</body>
</html>
