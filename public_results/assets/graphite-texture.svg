<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" preserveAspectRatio="none">
  <defs>
    <linearGradient id="graphite-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#48494b"/>
      <stop offset="0.52" stop-color="#393a3c"/>
      <stop offset="1" stop-color="#444547"/>
    </linearGradient>
    <filter id="graphite-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="4" seed="29" stitchTiles="stitch" result="paper-body"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.38" numOctaves="2" seed="71" stitchTiles="stitch" result="paper-fibre"/>
      <feBlend in="paper-body" in2="paper-fibre" mode="soft-light" result="paper-grain"/>
      <feColorMatrix in="paper-grain" type="matrix" values="
        0.34 0.34 0.34 0 0
        0.34 0.34 0.34 0 0
        0.34 0.34 0.34 0 0
        0    0    0    0.38 0" result="paper-tone"/>
      <feBlend in="SourceGraphic" in2="paper-tone" mode="soft-light"/>
    </filter>
  </defs>
  <rect width="800" height="480" fill="url(#graphite-base)" filter="url(#graphite-grain)"/>
</svg>
